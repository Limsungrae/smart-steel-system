<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteelForecast 회원가입</title>
    <link rel="stylesheet" th:href="@{/css/signup.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
<header class="header">
    <div class="logo">
        <a th:href="@{/}"><img th:src="@{/images/steel-logo.png}" alt="SteelForecast Logo"></a>
    </div>
</header>

<main class="signup-page">
    <section class="signup-card">
        <div class="signup-badge">AI Demand Forecast Platform</div>
        <h1>회원가입</h1>

        <form th:action="@{/signup/process}" method="post">

            <div class="form-group">
                <label>이름</label>
                <div class="input-box">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" name="name" placeholder="이름을 입력해주세요" required>
                </div>
            </div>

            <div class="form-group">
                <label>이메일 (계정 ID)</label>
                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" name="username" placeholder="이메일을 입력해주세요" required>
                </div>
            </div>

            <div class="form-group">
                <label>비밀번호</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" placeholder="비밀번호를 입력해주세요" required>
                </div>
            </div>

            <div class="form-group">
                <label>소속 부서</label>
                <div class="input-box">
                    <i class="fa-regular fa-building"></i>
                    <input type="text" name="department" placeholder="예: 생산관리팀" required>
                </div>
            </div>

            <div class="form-group">
                <label>직책</label>
                <div class="input-box">
                    <i class="fa-solid fa-id-badge"></i>
                    <input type="text" name="position" placeholder="예: 팀장, 사원" required>
                </div>
            </div>

            <label class="check-box">
                <input type="checkbox" required>
                <span>이용약관 및 개인정보 처리방침에 동의합니다.</span>
            </label>

            <button type="submit" class="signup-submit">회원가입 완료</button>

            <div class="bottom-text">
                이미 계정이 있으신가요?
                <a th:href="@{/login}">로그인하기</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
